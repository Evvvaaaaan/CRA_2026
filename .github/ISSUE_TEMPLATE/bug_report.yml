name: 버그 리포트
description: 재현 가능한 오류나 예상과 다른 동작을 제보합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 문제를 빠르게 확인할 수 있도록 아래 내용을 작성해 주세요.

  - type: textarea
    id: summary
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 간단하고 명확하게 설명해 주세요.
      placeholder: 무엇이 잘못 동작했나요?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있도록 순서대로 작성해 주세요.
      placeholder: |
        1. ... 페이지로 이동합니다.
        2. ... 버튼을 누릅니다.
        3. ... 오류가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상이라면 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 어떤 결과가 나타났나요? 오류 메시지도 함께 적어 주세요.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: 운영체제, 브라우저와 버전 등 문제를 확인하는 데 필요한 정보를 적어 주세요.
      placeholder: 예) macOS 15, Chrome 140
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 참고 자료
      description: 스크린샷, 영상, 로그 또는 관련 링크가 있다면 첨부해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 동일한 이슈가 이미 등록되어 있는지 검색했습니다.
          required: true
        - label: 민감한 정보가 포함되지 않았음을 확인했습니다.
          required: true
