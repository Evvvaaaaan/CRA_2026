name: 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        제안하는 기능이 해결할 문제와 완료 조건을 구체적으로 작성해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 배경 및 문제
      description: 현재 어떤 불편이나 문제가 있나요?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 기능이나 개선 방향을 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 이 이슈가 완료되었다고 판단할 수 있는 조건을 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 사용자는 ...할 수 있다.
        - [ ] ... 상황에서도 정상 동작한다.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 검토한 다른 해결 방법이 있다면 적어 주세요.

  - type: textarea
    id: context
    attributes:
      label: 참고 자료
      description: 화면 예시, 관련 문서 또는 링크가 있다면 첨부해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 동일하거나 유사한 제안이 이미 등록되어 있는지 검색했습니다.
          required: true
        - label: 한 이슈에는 하나의 목적만 담았습니다.
          required: true
